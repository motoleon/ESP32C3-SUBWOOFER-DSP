esphome:
  name: lfe-dsp
  friendly_name: LFE DSP
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          id(subwoofer_dsp).set_gain(id(lfe_gain).state);
          id(subwoofer_dsp).set_lpf_hz(id(lfe_lpf).state);
          id(subwoofer_dsp).set_hpf_hz(id(lfe_hpf_hz).state);
          id(subwoofer_dsp).set_bypass(id(lfe_bypass).state);
          id(subwoofer_dsp).set_invert_phase(id(lfe_invert_phase).state);
          id(subwoofer_dsp).set_hpf(id(lfe_hpf).state);
          id(subwoofer_dsp).set_loudness(id(lfe_loudness).state);
          id(subwoofer_dsp).set_loudness_db(id(lfe_loudness_db).state);    
          id(subwoofer_dsp).set_input_clip(id(lfe_input_clip).state);
          id(subwoofer_dsp).set_limiter(id(lfe_limiter).state);
          id(subwoofer_dsp).set_limiter_ceiling(id(lfe_limiter_ceiling).state);   
          id(subwoofer_dsp).set_lpf_stages((int) id(lfe_lpf_stages).state);     

esp32:
  variant: esp32c3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: y
      
logger:
  level: DEBUG # O el nivel que tengas
  logs:
    light: ERROR  # Esto silencia los mensajes [D][light:...]

api:
  reboot_timeout: 0s # Evita que el ESP32 se reinicie si pierde conexión con HA
  
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: HIGH           # muy importante en C3
  #output_power: 9.5dB
  output_power: 8.5dB
  fast_connect: true             # acelera reconexiones  
  manual_ip:
        static_ip: 192.168.0.206
        gateway: 192.168.0.1
        subnet: 255.255.255.0
        dns1: 8.8.8.8
        dns2: 8.8.4.4

network:
  enable_ipv6: false  

button:
  - platform: restart
    name: "REINICIAR"  
  
external_components:
  - source:
      type: local
      path: my_components
    components: [lfe_dsp, cpu_usage]

lfe_dsp:
  id: subwoofer_dsp
  adc_pin: GPIO4
  bclk_pin: GPIO7
  lrck_pin: GPIO9
  data_out_pin: GPIO10
  sample_rate: 8000       # 16000 menos ruido que a 24000
  gain: 1.0
  
number:
  - platform: template
    name: "LFE GANANCIA"
    id: lfe_gain
    restore_value: true
    icon: mdi:volume-high
    optimistic: true
    min_value: 0.0
    max_value: 8.0
    step: 0.5
    initial_value: 1.0
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_gain(x);
          
  - platform: template
    name: "LFE FREQ CORTE"
    id: lfe_lpf
    restore_value: true
    icon: mdi:sine-wave
    unit_of_measurement: "Hz"
    optimistic: true
    min_value: 40
    max_value: 250
    step: 5
    initial_value: 120
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_lpf_hz(x);

  - platform: template
    name: "LFE HPF"
    id: lfe_hpf_hz
    restore_value: true
    icon: mdi:sine-wave
    unit_of_measurement: "Hz"
    optimistic: true
    min_value: 10
    max_value: 60
    step: 1
    initial_value: 18
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_hpf_hz(x);

  - platform: template
    name: "LFE BASS BOOST dB"
    id: lfe_loudness_db
    icon: mdi:tune-vertical
    unit_of_measurement: "dB"
    min_value: 6
    max_value: 24
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_loudness_db(x);
         
  - platform: template
    name: "LFE recorte entrada"
    id: lfe_input_clip
    icon: mdi:arrow-collapse-horizontal
    optimistic: true
    restore_value: true
    min_value: 400
    max_value: 1800
    step: 50
    initial_value: 900
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_input_clip((int32_t) x);

  - platform: template
    name: "LFE techo limitador"
    id: lfe_limiter_ceiling
    icon: mdi:arrow-collapse-down
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 98
    step: 1
    initial_value: 85
    unit_of_measurement: "%"
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_limiter_ceiling(x);

  - platform: template
    name: "LFE LPF etapas"
    id: lfe_lpf_stages
    icon: mdi:filter-multiple
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 3
    step: 1
    initial_value: 2
    set_action:
      - lambda: |-
          id(subwoofer_dsp).set_lpf_stages((int) x);
          
switch:
  - platform: template
    name: "LFE BYPASS"
    id: lfe_bypass  
    icon: mdi:audio-input-rca
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(subwoofer_dsp).set_bypass(true);
    turn_off_action:
      - lambda: |-
          id(subwoofer_dsp).set_bypass(false);

  - platform: template
    name: "LFE INVERTIR FASE"
    id: lfe_invert_phase
    icon: mdi:sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(subwoofer_dsp).set_invert_phase(true);
    turn_off_action:
      - lambda: |-
          id(subwoofer_dsp).set_invert_phase(false);
          
  - platform: template
    name: "LFE HPF"
    id: lfe_hpf
    icon: mdi:tune-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          id(subwoofer_dsp).set_hpf(true);
    turn_off_action:
      - lambda: |-
          id(subwoofer_dsp).set_hpf(false);
          
  - platform: template
    name: "LFE BASS BOOST"
    id: lfe_loudness
    icon: mdi:volume-vibrate
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(subwoofer_dsp).set_loudness(true);
    turn_off_action:
      - lambda: |-
          id(subwoofer_dsp).set_loudness(false);

  - platform: template
    name: "LFE limitador"
    id: lfe_limiter
    icon: mdi:shield-half-full
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(subwoofer_dsp).set_limiter(true);
    turn_off_action:
      - lambda: |-
          id(subwoofer_dsp).set_limiter(false);
        
output:
  - platform: gpio
    id: salida_led
    pin: 
      number: GPIO8
      ignore_strapping_warning: true
    inverted: true  # <--- ESTO ARREGLA TODO  
    
light:
  - platform: binary
    id: led_wifi
    output: salida_led
    
interval:
  - interval: 2s
    then:
      - if:
          condition:
            api.connected:
          then:
            - light.turn_on: led_wifi
            - delay: 100ms
            - light.turn_off: led_wifi
          else:
            - light.turn_off: led_wifi   

binary_sensor:
  - platform: template
    name: "LFE CLIP IN"
    id: lfe_clip_in
    icon: mdi:alert
    lambda: |-
      return id(subwoofer_dsp).get_clip_in();

  - platform: template
    name: "LFE CLIP OUT"
    id: lfe_clip_out
    icon: mdi:alert-circle
    lambda: |-
      return id(subwoofer_dsp).get_clip_out();
              
sensor:
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    id: wifi_signal_porc
    filters: # Linear: -100dBm=0%, >-20dBm=100%
      - lambda: return min(max(min(100.0 + x, 80.0) / 80.0 * 100.0, 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"  
    
  - platform: internal_temperature # Normal: 40-55°C idle; con rate alto puede subir a 65-75°C (límite seguro ~85-90°C).
    name: "Temperatura Chip"
    update_interval: 10s  
    id: temperatura_chip    

  - platform: template
    name: "LFE RMS IN"
    id: lfe_rms
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      return id(subwoofer_dsp).get_rms_percent();

  - platform: template
    name: "LFE PICO IN"
    id: lfe_peak
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      return id(subwoofer_dsp).get_peak_percent();
      
  - platform: template
    name: "LFE RMS OUT"
    id: lfe_rms_out
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      return id(subwoofer_dsp).get_rms_out_percent();

  - platform: template
    name: "LFE PICO OUT"
    id: lfe_peak_out
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      return id(subwoofer_dsp).get_peak_out_percent();

  - platform: template
    name: "LFE reduccion limitador"
    id: lfe_limiter_gr
    unit_of_measurement: "dB"
    icon: mdi:arrow-collapse-vertical
    accuracy_decimals: 1
    update_interval: 500ms
    lambda: |-
      return id(subwoofer_dsp).get_limiter_gr_db();

  - platform: cpu_usage
    name: "CPU Usage"
    id: cpuusage
    update_interval: 1s     
    accuracy_decimals: 1
      
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  
font:
  - file: "gfonts://Roboto Mono"
    id: font_min
    size: 10   
  - file: "gfonts://Roboto Mono"
    id: font_med
    size: 15      
  - file: "gfonts://Roboto Mono"
    id: font_max
    size: 20   
    
display:
  - platform: ssd1306_i2c
    id: my_display
    model: "SSD1306 72x40"
    address: 0x3C
    contrast: 0.1 # <--- Brillo bajo fijo, sin sliders
    update_interval: 500ms
    lambda: |-
        it.printf(0, -4, id(font_med), "%.0f C", id(temperatura_chip).state);      
        it.printf(0, 11, id(font_med), "%.0f PKI", id(lfe_peak).state);    
        it.printf(0, 24, id(font_med), "%.0f PKO", id(lfe_peak_out).state);
 